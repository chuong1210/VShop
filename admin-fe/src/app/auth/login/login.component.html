<app-loading [show]="loginMutate.isPending()" [onTop]="true" />

<!-- Main Container: Gradient background nhẹ nhàng -->
<div class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8 font-sans">

  <!-- Card Container -->
  <div class="bg-white w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col lg:flex-row h-auto lg:h-[650px]">

    <!-- Left Side: Image (Ẩn trên mobile, hiện trên lg) -->
    <div class="hidden lg:block lg:w-1/2 relative bg-gray-900">
      <img
        src="assets/images/login/panel.jpg"
        alt="Login background"
        class="absolute inset-0 h-full w-full object-cover opacity-90"
      />
      <!-- Overlay text (Optional) -->
      <div class="absolute inset-0 bg-green-900/30 flex items-center justify-center">
        <h2 class="text-white text-4xl font-bold tracking-widest drop-shadow-md">WELCOME</h2>
      </div>
    </div>

    <!-- Right Side: Form -->
    <div class="w-full lg:w-1/2 p-8 sm:p-12 flex flex-col justify-center relative bg-white">

      <!-- Logo Section -->
      <div class="text-center mb-10">
        <div class="inline-block relative">
          <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-full overflow-hidden border-4 border-white shadow-lg mx-auto bg-white">
            <img
              src="assets/images/login/logo.jpg"
              alt="Logo"
              class="w-full h-full object-cover"
            />
          </div>
        </div>
        <h3 class="mt-4 text-2xl font-bold text-gray-800">Đăng Nhập</h3>
        <p class="text-sm text-gray-500 mt-2">Nhập thông tin chi tiết của bạn để vào hệ thống</p>
      </div>

      <!-- Form Section -->
      <div class="space-y-6 max-w-md mx-auto w-full">

        <!-- Username Input -->
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-user text-gray-400 group-focus-within:text-emerald-500 transition-colors"></i>
          </div>
          <input
            type="text"
            [(ngModel)]="username"
            placeholder="Tên đăng nhập"
            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all shadow-sm text-gray-700 sm:text-sm"
          />
        </div>

        <!-- Password Input -->
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-lock text-gray-400 group-focus-within:text-emerald-500 transition-colors"></i>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Mật khẩu"
            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all shadow-sm text-gray-700 sm:text-sm"
            (keydown.enter)="Login()"
          />

          <!-- Toggle Password Icon -->
          <div
            class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-gray-600"
            (click)="showPassword = !showPassword"
          >
            <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </div>
        </div>

        <!-- Forgot Password (Optional - Thêm vào cho đẹp layout) -->
        <div class="flex items-center justify-end">
            <a href="javascript:void(0)" class="text-sm font-medium text-emerald-600 hover:text-emerald-500">
                Quên mật khẩu?
            </a>
        </div>

        <!-- Login Button -->
        <div>
          <button
            (click)="Login()"
            [disabled]="loginMutate.isPending()"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all transform active:scale-[0.98]"
          >
            <span *ngIf="!loginMutate.isPending()">Đăng nhập</span>
            <span *ngIf="loginMutate.isPending()"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Đang xử lý...</span>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
