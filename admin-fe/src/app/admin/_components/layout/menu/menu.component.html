<div class="menu-container h-full bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 p-3 overflow-y-auto">
	<!-- Logo Section -->
	<div class="mb-6 px-3 py-4 border-b border-slate-700">
		<div class="flex items-center gap-3">
			<div class="w-10 h-10 rounded-lg bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center shadow-lg">
				<i class="fa-solid fa-store text-white text-xl"></i>
			</div>
			<div>
				<h2 class="text-white font-bold text-lg">Admin Panel</h2>
				<p class="text-slate-400 text-xs">Quản trị hệ thống</p>
			</div>
		</div>
	</div>

	<!-- Menu Items -->
	<div class="space-y-2">
		<app-menu-item
			*ngFor="let item of menu"
			[data]="item"
			[activeItem]="active()"
			(onClick)="onMenuItemClick($event)"
		/>
	</div>

	<!-- Footer -->
	<div class="mt-8 px-3 py-4 border-t border-slate-700">
		<div class="text-slate-500 text-xs text-center">
			<p>© 2025 VShop</p>
			<p class="mt-1">Version 1.0.0</p>
		</div>
	</div>
</div>
